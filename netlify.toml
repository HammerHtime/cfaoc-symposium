# Netlify configuration for the CFAOC event site.
#
# The site is at the repo root, so Netlify picks these up with no UI configuration:
#   Build command:       node build.js
#   Publish directory:   dist

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs: /victoria and /victoria/ both resolve.
[[redirects]]
  from = "/victoria"
  to = "/victoria/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The site loads only its own CSS/JS/images plus Google Fonts. No inline
    # scripts or styles are emitted, so both can be locked to 'self'.
    # NOTE: turning on site.googleAnalyticsId emits an inline script and a
    # googletagmanager.com tag — both blocked until this policy is widened.
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"

# Asset filenames are stable (hero-artwork.png, hotel photos, og-default.png) and
# the documented workflow is to replace them in place — so they must NOT be
# immutable, or a returning visitor keeps the old image for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Netlify configuration for the CFAOC event site.
#
# The site is at the repo root, so Netlify picks these up with no UI configuration:
#   Build command:       node build.js
#   Publish directory:   dist

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs: /victoria and /victoria/ both resolve.
[[redirects]]
  from = "/victoria"
  to = "/victoria/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Asset filenames are stable (hero-artwork.png, hotel photos, og-default.png) and
# the documented workflow is to replace them in place — so they must NOT be
# immutable, or a returning visitor keeps the old image for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
